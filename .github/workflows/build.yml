name: Pension Report Auto Build

on:
  schedule:
    # GitHub Actions schedule cron은 정확히 trigger 안 됨 (peak 시간대 skip 흔함).
    # 15분 주기 — 토스 trading-trend가 분단위 갱신이라 15분 단위면 적당.
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: write      # 빌드 결과 push 권한

concurrency:
  group: pension-report-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-report.txt

      - name: Install dependencies
        run: pip install -r requirements-report.txt

      - name: Build realtime mode
        run: python -m report.generate --mode realtime
        env:
          TZ: Asia/Seoul

      - name: Build closing mode (after 16 KST)
        run: |
          KST_HOUR=$(TZ=Asia/Seoul date +%H)
          echo "Current KST hour: $KST_HOUR"
          if [ "$KST_HOUR" -ge 16 ]; then
            python -m report.generate --mode closing
          else
            echo "Skip closing build (before 16 KST)"
          fi
        env:
          TZ: Asia/Seoul

      - name: Copy output to docs
        run: |
          mkdir -p docs
          cp -r report/output/* docs/

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs data/pension_report.db 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
            git commit -m "auto-update $TIMESTAMP [GH Actions]"
            git push
          fi
